<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="igGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f09433" />
      <stop offset="25%" style="stop-color:#e6683c" />
      <stop offset="50%" style="stop-color:#dc2743" />
      <stop offset="75%" style="stop-color:#cc2366" />
      <stop offset="100%" style="stop-color:#bc1888" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#a0a0c0" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#bc1888;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#dc2743" />
      <stop offset="60%" style="stop-color:#4a90d9" />
      <stop offset="100%" style="stop-color:#69C9D0;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative accent line at bottom -->
  <rect x="0" y="152" width="900" height="4" rx="2" fill="url(#accentLine)" />

  <!-- Subtle grid pattern (right side decoration) -->
  <g opacity="0.06">
    <line x1="620" y1="0" x2="620" y2="160" stroke="white" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="160" stroke="white" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="160" stroke="white" stroke-width="1"/>
    <line x1="740" y1="0" x2="740" y2="160" stroke="white" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="160" stroke="white" stroke-width="1"/>
    <line x1="820" y1="0" x2="820" y2="160" stroke="white" stroke-width="1"/>
    <line x1="860" y1="0" x2="860" y2="160" stroke="white" stroke-width="1"/>
    <line x1="600" y1="20" x2="900" y2="20" stroke="white" stroke-width="1"/>
    <line x1="600" y1="60" x2="900" y2="60" stroke="white" stroke-width="1"/>
    <line x1="600" y1="100" x2="900" y2="100" stroke="white" stroke-width="1"/>
    <line x1="600" y1="140" x2="900" y2="140" stroke="white" stroke-width="1"/>
  </g>

  <!-- Instagram icon -->
  <rect x="32" y="30" width="50" height="50" rx="14" fill="url(#igGrad)" />
  <rect x="41" y="39" width="32" height="32" rx="9" fill="none" stroke="white" stroke-width="2.5" />
  <circle cx="57" cy="55" r="8" fill="none" stroke="white" stroke-width="2.5" />
  <circle cx="68" cy="44" r="2.5" fill="white" />

  <!-- TikTok icon -->
  <rect x="32" y="92" width="50" height="50" rx="14" fill="#111" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="57" y="124" font-size="28" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" fill="white">♪</text>
  <circle cx="70" cy="100" r="5.5" fill="#69C9D0" />
  <circle cx="65" cy="105" r="5.5" fill="#EE1D52" />

  <!-- Connector lines -->
  <circle cx="93" cy="55" r="3" fill="#444" />
  <circle cx="105" cy="55" r="3" fill="#555" />
  <circle cx="117" cy="55" r="3" fill="#555" />
  <circle cx="93" cy="117" r="3" fill="#444" />
  <circle cx="105" cy="117" r="3" fill="#555" />
  <circle cx="117" cy="117" r="3" fill="#555" />

  <!-- Merge lines -->
  <line x1="130" y1="55" x2="155" y2="86" stroke="#3a3a4a" stroke-width="2" />
  <line x1="130" y1="117" x2="155" y2="86" stroke="#3a3a4a" stroke-width="2" />
  <polygon points="158,86 148,78 168,78" fill="#4a4a5a" />

  <!-- Table icon -->
  <rect x="174" y="66" width="58" height="40" rx="5" fill="none" stroke="#4a90d9" stroke-width="2" />
  <line x1="174" y1="79" x2="232" y2="79" stroke="#4a90d9" stroke-width="1.5" />
  <line x1="174" y1="92" x2="232" y2="92" stroke="#4a90d9" stroke-width="1.5" />
  <line x1="203" y1="66" x2="203" y2="106" stroke="#4a90d9" stroke-width="1.5" />
  <rect x="177" y="69" width="23" height="8" rx="2" fill="#4a90d9" opacity="0.45" />
  <rect x="206" y="69" width="23" height="8" rx="2" fill="#4a90d9" opacity="0.45" />
  <rect x="177" y="81" width="23" height="9" rx="2" fill="#4a90d9" opacity="0.2" />
  <rect x="206" y="81" width="23" height="9" rx="2" fill="#4a90d9" opacity="0.2" />
  <rect x="177" y="94" width="23" height="9" rx="2" fill="#4a90d9" opacity="0.2" />
  <rect x="206" y="94" width="23" height="9" rx="2" fill="#4a90d9" opacity="0.2" />

  <!-- Main title -->
  <text x="256" y="78" font-size="40" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.5">Social Media</text>
  <text x="256" y="122" font-size="40" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.5">Data Parser</text>

  <!-- Tags -->
  <rect x="256" y="132" width="96" height="20" rx="10" fill="#1a3a5c" />
  <text x="304" y="146" font-size="11.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" fill="#4a90d9">📷 Instagram</text>

  <rect x="360" y="132" width="80" height="20" rx="10" fill="#2a1020" />
  <text x="400" y="146" font-size="11.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" fill="#EE1D52">♪ TikTok</text>

  <rect x="448" y="132" width="90" height="20" rx="10" fill="#162616" />
  <text x="493" y="146" font-size="11.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" fill="#4caf50">🐍 Python 3.9+</text>

  <rect x="546" y="132" width="102" height="20" rx="10" fill="#1a1a30" />
  <text x="597" y="146" font-size="11.5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" fill="#a0a0d0">📊 datascience</text>
</svg>
